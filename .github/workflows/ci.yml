# R: Run the source and artifact checks that govern integration and release.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWARENESS_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/kshiai_awareness_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kshiai_awareness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kshiai_awareness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install SealGraph
        env:
          SEALGRAPH_COMMIT: c23aa34cea273d7aa2beb94b9c9d69a924560fe6
        run: |
          runner_bin="${RUNNER_TEMP}/sealgraph-bin"
          mkdir -p "${runner_bin}"
          GOBIN="${runner_bin}" go install \
            "github.com/mako10k/sealgraph/cmd/sealgraph@${SEALGRAPH_COMMIT}"
          echo "${runner_bin}" >> "${GITHUB_PATH}"
          "${runner_bin}/sealgraph" --version
      - name: Prepare test authority runtime
        run: node scripts/prepare-test-authority-runtime.mjs
      - run: npm ci
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-static.txt
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Verify accepted awareness execution and prompt contracts
        run: npm run test:awareness
      - name: Verify generated files are clean
        run: git diff --exit-code

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Check dependency advisories
        run: node scripts/check-npm-audit.mjs
      - name: Scan repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

  backend-image:
    name: backend-image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag kshiai-backend:ci .
      - name: Import compiled API modules from the runtime image
        run: |
          docker run --rm --entrypoint node \
            --env NODE_ENV=test --env AUTH_PROVIDER=legacy --env LLM_PROVIDER=mock \
            kshiai-backend:ci --input-type=module --eval '
              await import("./backend/dist/llm/index.js");
              await import("./backend/dist/routes.js");
              console.log("Compiled API runtime module graph imported successfully");
            '
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kshiai-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:deployment
      - run: npm run typecheck:deployment
      - run: npm run build:worker
