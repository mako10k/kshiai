name: Stage release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag; dispatch this workflow from the same tag
        required: true
        type: string
      battle_causal_narration_mode:
        description: Causal narration mode baked into the staged Cloud Run revision
        required: true
        default: narration_guarded
        type: choice
        options:
          - narration_guarded
          - off
      dialogue_context_projection_override:
        description: Revision-local dialogue projection for isolated staging observations
        required: true
        default: none
        type: choice
        options:
          - none
          - compact
          - legacy
      expected_dialogue_projection:
        description: Dialogue projection that the staged battle must bind
        required: true
        default: compact
        type: choice
        options:
          - compact
          - legacy
      e2e_max_advances:
        description: Maximum advances for the staged functional battle
        required: true
        default: "24"
        type: string
      e2e_provider_operation_ceiling:
        description: Maximum provider operations for the staged functional battle
        required: true
        default: "169"
        type: string
      battle_pacing_policy:
        description: Provisional pacing policy frozen into newly created battles
        required: true
        default: current
        type: choice
        options:
          - current
          - candidate-12-v2

permissions:
  checks: read
  contents: read
  id-token: write

concurrency:
  group: release-staging
  cancel-in-progress: false

env:
  GCP_PROJECT: kshiai
  GCP_REGION: asia-northeast1
  CLOUD_RUN_SERVICE: kshiai-api
  MIGRATION_JOB: kshiai-migrate
  AUTH_SMOKE_JOB: kshiai-auth-smoke
  E2E_JOB: kshiai-persistent-e2e
  R2_SMOKE_JOB: kshiai-r2-smoke
  IMAGE_REPOSITORY: asia-northeast1-docker.pkg.dev/kshiai/kshiai/backend
  WORKER_NAME: kshiai-web
  WORKERS_SUBDOMAIN: mako10k
  WRANGLER_CONFIG: infra/cloudflare-worker/wrangler.jsonc
  SUPABASE_URL: https://cvrbhpkfqkpqdegxfrlq.supabase.co
  SUPABASE_JWKS_URL: https://cvrbhpkfqkpqdegxfrlq.supabase.co/auth/v1/.well-known/jwks.json
  ADMIN_EMAILS: mako10k@mk10.org
  NARRATION_TASK_QUEUE: kshiai-narration
  NARRATION_TASK_SERVICE_ACCOUNT_EMAIL: kshiai-cloud-run@kshiai.iam.gserviceaccount.com

jobs:
  stage:
    name: stage-release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    steps:
      - name: Validate dispatch authority
        env:
          CAUSAL_NARRATION_MODE: ${{ inputs.battle_causal_narration_mode }}
          DIALOGUE_CONTEXT_PROJECTION_OVERRIDE: ${{ inputs.dialogue_context_projection_override }}
          EXPECTED_DIALOGUE_PROJECTION: ${{ inputs.expected_dialogue_projection }}
          E2E_MAX_ADVANCES: ${{ inputs.e2e_max_advances }}
          E2E_PROVIDER_OPERATION_CEILING: ${{ inputs.e2e_provider_operation_ceiling }}
          PACING_POLICY: ${{ inputs.battle_pacing_policy }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          [[ "$CAUSAL_NARRATION_MODE" =~ ^(off|narration_guarded)$ ]]
          [[ "$DIALOGUE_CONTEXT_PROJECTION_OVERRIDE" =~ ^(none|compact|legacy)$ ]]
          [[ "$EXPECTED_DIALOGUE_PROJECTION" =~ ^(compact|legacy)$ ]]
          [[ "$E2E_MAX_ADVANCES" =~ ^[0-9]+$ ]]
          test "$E2E_MAX_ADVANCES" -ge 1
          test "$E2E_MAX_ADVANCES" -le 30
          [[ "$E2E_PROVIDER_OPERATION_CEILING" =~ ^[0-9]+$ ]]
          test "$E2E_PROVIDER_OPERATION_CEILING" -ge 1
          [[ "$PACING_POLICY" =~ ^(current|candidate-12-v2)$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Verify release tag and required checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/verify-release.mjs "$RELEASE_TAG"
          node scripts/verify-required-checks.mjs

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify narration task queue
        run: |
          set -euo pipefail
          gcloud tasks queues describe "$NARRATION_TASK_QUEUE" \
            --project="$GCP_PROJECT" \
            --location="$GCP_REGION" \
            --format='value(state)' | grep -Fx RUNNING

      - name: Build immutable backend image
        id: image
        run: |
          set -euo pipefail
          image_tag="$IMAGE_REPOSITORY:$GITHUB_SHA"
          build_id="$(gcloud builds submit . \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --gcs-source-staging-dir=gs://kshiai_cloudbuild/source \
            --async \
            --format='value(id)' \
            --config=infra/cloudbuild.backend.yaml \
            --substitutions="_IMAGE=$image_tag")"
          test -n "$build_id"
          status=""
          for _attempt in {1..180}; do
            status="$(gcloud builds describe "$build_id" \
              --project="$GCP_PROJECT" \
              --region="$GCP_REGION" \
              --format='value(status)')"
            case "$status" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build $build_id ended with $status" >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          test "$status" = "SUCCESS"
          digest="$(gcloud artifacts docker images describe "$image_tag" \
            --project="$GCP_PROJECT" \
            --format='value(image_summary.digest)')"
          test -n "$digest"
          echo "ref=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Apply forward-only migrations
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$MIGRATION_JOB" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --image="$IMAGE_REF" \
            --service-account=kshiai-cloud-run@kshiai.iam.gserviceaccount.com \
            --set-secrets=DIRECT_URL=kshiai-direct-url:latest \
            --command=node \
            --args=backend/dist/scripts/postgres-migrations.js,--apply \
            --max-retries=0 \
            --task-timeout=10m \
            --quiet
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --wait

      - name: Deploy tagged Cloud Run revision without traffic
        id: backend
        env:
          CAUSAL_NARRATION_MODE: ${{ inputs.battle_causal_narration_mode }}
          DIALOGUE_CONTEXT_PROJECTION_OVERRIDE: ${{ inputs.dialogue_context_projection_override }}
          PACING_POLICY: ${{ inputs.battle_pacing_policy }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          alias="stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          service_url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT" --region="$GCP_REGION" \
            --format='value(status.url)')"
          service_host="${service_url#https://}"
          narration_task_target_url="https://${alias}---${service_host}/api/internal/narration/task"
          override_flags=(
            --update-env-vars="BATTLE_CAUSAL_NARRATION_MODE=$CAUSAL_NARRATION_MODE,ADMIN_EMAILS=$ADMIN_EMAILS,BATTLE_PACING_POLICY=$PACING_POLICY,NARRATION_TASK_PROJECT=$GCP_PROJECT,NARRATION_TASK_LOCATION=$GCP_REGION,NARRATION_TASK_QUEUE=$NARRATION_TASK_QUEUE,NARRATION_TASK_TARGET_URL=$narration_task_target_url,NARRATION_TASK_SERVICE_ACCOUNT_EMAIL=$NARRATION_TASK_SERVICE_ACCOUNT_EMAIL,NARRATION_TASK_AUDIENCE=$narration_task_target_url"
            --remove-env-vars="DIALOGUE_CONTEXT_PROJECTION_OVERRIDE,DIALOGUE_CONTEXT_PROJECTION_OVERRIDE_COMMIT_SHA,DIALOGUE_CONTEXT_PROJECTION_OVERRIDE_ARTIFACT_REF"
          )
          if [[ "$DIALOGUE_CONTEXT_PROJECTION_OVERRIDE" != "none" ]]; then
            override_flags=(--update-env-vars="BATTLE_CAUSAL_NARRATION_MODE=$CAUSAL_NARRATION_MODE,ADMIN_EMAILS=$ADMIN_EMAILS,BATTLE_PACING_POLICY=$PACING_POLICY,DIALOGUE_CONTEXT_PROJECTION_OVERRIDE=$DIALOGUE_CONTEXT_PROJECTION_OVERRIDE,DIALOGUE_CONTEXT_PROJECTION_OVERRIDE_COMMIT_SHA=$GITHUB_SHA,DIALOGUE_CONTEXT_PROJECTION_OVERRIDE_ARTIFACT_REF=$IMAGE_REF,NARRATION_TASK_PROJECT=$GCP_PROJECT,NARRATION_TASK_LOCATION=$GCP_REGION,NARRATION_TASK_QUEUE=$NARRATION_TASK_QUEUE,NARRATION_TASK_TARGET_URL=$narration_task_target_url,NARRATION_TASK_SERVICE_ACCOUNT_EMAIL=$NARRATION_TASK_SERVICE_ACCOUNT_EMAIL,NARRATION_TASK_AUDIENCE=$narration_task_target_url")
          fi
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --image="$IMAGE_REF" \
            --no-traffic \
            --tag="$alias" \
            --update-secrets=SUPABASE_SECRET_KEY=kshiai-supabase-secret-key:latest \
            "${override_flags[@]}" \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/service.json"
          # shellcheck disable=SC2016
          ALIAS="$alias" node -e '
            const fs = require("fs");
            const service = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const traffic = service.status.traffic.find((entry) => entry.tag === process.env.ALIAS);
            if (!traffic?.url || !traffic?.revisionName) throw new Error("Tagged revision was not found");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${traffic.url}\nrevision=${traffic.revisionName}\n`);
          ' "$RUNNER_TEMP/service.json"

      - name: Prove exact narration receipt lifecycle without an LLM
        run: |
          set -euo pipefail
          npm run build --workspace=@kshiai/shared
          (
            cd backend
            node --import tsx --test \
              --test-name-pattern="claims only the exact receipt generation" \
              src/services/narration-worker.test.ts
          )

      - name: Prove provider attempt accounting without an LLM
        run: |
          set -euo pipefail
          (
            cd backend
            node --import tsx --test src/llm/provider-accounting.test.ts
          )

      - name: Prove narration and authoring Cloud Tasks OIDC delivery
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: |
          set -euo pipefail
          smoke_id="stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          task_name="narration-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target_url="${BACKEND_URL%/}/api/internal/narration/task"
          gcloud tasks create-http-task "$task_name" \
            --project="$GCP_PROJECT" \
            --location="$GCP_REGION" \
            --queue="$NARRATION_TASK_QUEUE" \
            --url="$target_url" \
            --method=POST \
            --header='Content-Type: application/json' \
            --body-content="{\"smokeId\":\"$smoke_id\"}" \
            --oidc-service-account-email="$NARRATION_TASK_SERVICE_ACCOUNT_EMAIL" \
            --oidc-token-audience="$target_url"
          found=""
          for _ in {1..24}; do
            found="$(gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.revision_name=${{ steps.backend.outputs.revision }} AND textPayload=\"[narration] task smoke ok $smoke_id\"" \
              --project="$GCP_PROJECT" --limit=1 --format='value(textPayload)')"
            [[ -n "$found" ]] && break
            sleep 5
          done
          test "$found" = "[narration] task smoke ok $smoke_id"

          authoring_smoke_id="authoring-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          authoring_task_name="authoring-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          authoring_target_url="${BACKEND_URL%/}/api/internal/authoring/task"
          gcloud tasks create-http-task "$authoring_task_name" \
            --project="$GCP_PROJECT" \
            --location="$GCP_REGION" \
            --queue="$NARRATION_TASK_QUEUE" \
            --url="$authoring_target_url" \
            --method=POST \
            --header='Content-Type: application/json' \
            --body-content="{\"smokeId\":\"$authoring_smoke_id\"}" \
            --oidc-service-account-email="$NARRATION_TASK_SERVICE_ACCOUNT_EMAIL" \
            --oidc-token-audience="$authoring_target_url"
          authoring_found=""
          for _ in {1..24}; do
            authoring_found="$(gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.revision_name=${{ steps.backend.outputs.revision }} AND textPayload=\"[authoring] task smoke ok $authoring_smoke_id\"" \
              --project="$GCP_PROJECT" --limit=1 --format='value(textPayload)')"
            [[ -n "$authoring_found" ]] && break
            sleep 5
          done
          test "$authoring_found" = "[authoring] task smoke ok $authoring_smoke_id"

      - name: Build and upload immutable Worker version
        id: worker
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          set -euo pipefail
          npm run build --workspace=@kshiai/shared
          npm run build --workspace=frontend
          node scripts/verify-frontend-auth-build.mjs frontend/dist
          npx wrangler whoami --json > "$RUNNER_TEMP/cloudflare-whoami.json"
          # shellcheck disable=SC2016
          cloudflare_account_id="$(node -e '
            const fs = require("fs");
            const identity = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!identity.loggedIn || identity.accounts?.length !== 1) {
              throw new Error("Expected the deployment token to resolve exactly one Cloudflare account");
            }
            process.stdout.write(identity.accounts[0].id);
          ' "$RUNNER_TEMP/cloudflare-whoami.json")"
          [[ "$cloudflare_account_id" =~ ^[a-f0-9]{32}$ ]]
          curl --fail-with-body --silent --show-error \
            --output "$RUNNER_TEMP/cloudflare-subdomain.json" \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"enabled":false,"previews_enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/$cloudflare_account_id/workers/scripts/$WORKER_NAME/subdomain"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!response.success || response.result?.enabled !== false || response.result?.previews_enabled !== true) {
              throw new Error("Cloudflare did not enable Worker preview URLs with workers.dev disabled");
            }
          ' "$RUNNER_TEMP/cloudflare-subdomain.json"
          alias="stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx wrangler versions upload \
            --config "$WRANGLER_CONFIG" \
            --tag "$RELEASE_TAG" \
            --message "Release $RELEASE_TAG from $GITHUB_SHA" \
            --preview-alias "$alias" \
            --var "BACKEND_ORIGIN:$BACKEND_URL" \
            --strict
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const events = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8")
              .trim().split("\n").map(JSON.parse);
            const upload = events.findLast((event) => event.type === "version-upload");
            if (!upload?.version_id) throw new Error("Wrangler did not record a version ID");
            const previewUrl = new URL(upload.preview_url);
            if (previewUrl.protocol !== "https:" || !previewUrl.hostname.endsWith(".workers.dev")) {
              throw new Error("Wrangler did not record a valid version preview URL");
            }
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `version=${upload.version_id}\npreview_url=${previewUrl.href}\n`,
            );
          '

      - name: Smoke staging edge and protected origin
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
          PREVIEW_URL: ${{ steps.worker.outputs.preview_url }}
          REVISION: ${{ steps.backend.outputs.revision }}
        run: node scripts/smoke-deployment.mjs "$PREVIEW_URL" "$BACKEND_URL" "$REVISION"

      - name: Verify email auth mapping and SSE through staging
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          PREVIEW_URL: ${{ steps.worker.outputs.preview_url }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$AUTH_SMOKE_JOB" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --image="$IMAGE_REF" \
            --service-account=kshiai-cloud-run@kshiai.iam.gserviceaccount.com \
            --set-env-vars="NODE_ENV=test,AUTH_PROVIDER=supabase,MEDIA_STORAGE=local,SUPABASE_URL=$SUPABASE_URL,SUPABASE_JWKS_URL=$SUPABASE_JWKS_URL,AUTH_SMOKE_API_URL=$PREVIEW_URL,AUTH_SMOKE_SSE=1" \
            --set-secrets="DATABASE_URL=kshiai-database-url:latest,SUPABASE_SECRET_KEY=kshiai-supabase-secret-key:latest,SUPABASE_PUBLISHABLE_KEY=kshiai-supabase-publishable-key:latest" \
            --command=node \
            --args=backend/dist/scripts/supabase-auth-smoke.js \
            --max-retries=0 \
            --task-timeout=10m \
            --quiet
          gcloud run jobs execute "$AUTH_SMOKE_JOB" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --wait

      - name: Exercise the exact staged revision with a dialogue-bound battle
        id: e2e
        env:
          DIALOGUE_CONTEXT_PROJECTION_OVERRIDE: ${{ inputs.dialogue_context_projection_override }}
          EXPECTED_DIALOGUE_PROJECTION: ${{ inputs.expected_dialogue_projection }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          MAX_ADVANCES: ${{ inputs.e2e_max_advances }}
          PREVIEW_URL: ${{ steps.worker.outputs.preview_url }}
          PROVIDER_OPERATION_CEILING: ${{ inputs.e2e_provider_operation_ceiling }}
          REVISION: ${{ steps.backend.outputs.revision }}
        run: |
          set -euo pipefail
          preview_host="$(node -e 'process.stdout.write(new URL(process.argv[1]).hostname)' "$PREVIEW_URL")"
          activation_source="persisted_setting"
          if [[ "$DIALOGUE_CONTEXT_PROJECTION_OVERRIDE" != "none" ]]; then
            activation_source="deployment_override"
          fi
          observation_run_id="stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run jobs deploy "$E2E_JOB" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --image="$IMAGE_REF" \
            --service-account=kshiai-cloud-run@kshiai.iam.gserviceaccount.com \
            --set-env-vars="NODE_ENV=test,KSHIAI_RUN_E2E_MAIN=1,AUTH_PROVIDER=supabase,MEDIA_STORAGE=local,SUPABASE_URL=$SUPABASE_URL,SUPABASE_JWKS_URL=$SUPABASE_JWKS_URL,E2E_API_URL=$PREVIEW_URL,E2E_ALLOWED_HOSTS=$preview_host,E2E_MAX_ADVANCES=$MAX_ADVANCES,E2E_TARGET_REVISION=$REVISION,E2E_EXPECTED_DIALOGUE_PROJECTION=$EXPECTED_DIALOGUE_PROJECTION,E2E_EXPECTED_DIALOGUE_ACTIVATION_SOURCE=$activation_source,E2E_RUN_ID=$observation_run_id,E2E_OBSERVATION_APPROVED_RUN_ID=$observation_run_id,E2E_PROVIDER_OPERATION_CEILING=$PROVIDER_OPERATION_CEILING" \
            --set-secrets="DATABASE_URL=kshiai-database-url:latest,SUPABASE_SECRET_KEY=kshiai-supabase-secret-key:latest,SUPABASE_PUBLISHABLE_KEY=kshiai-supabase-publishable-key:latest" \
            --command=node \
            --args=backend/dist/scripts/persistent-battle-e2e.js \
            --max-retries=0 \
            --task-timeout=25m \
            --quiet
          execution="$(gcloud run jobs execute "$E2E_JOB" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --wait \
            --format='value(metadata.name)')"
          [[ "$execution" =~ ^kshiai-persistent-e2e-[a-z0-9-]+$ ]]
          echo "execution=$execution" >> "$GITHUB_OUTPUT"
          echo "activation_source=$activation_source" >> "$GITHUB_OUTPUT"

      - name: Read public R2 service configuration
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/service-r2.json"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const service = require(process.argv[1]);
            const env = Object.fromEntries(service.spec.template.spec.containers[0].env
              .filter((entry) => entry.value !== undefined)
              .map((entry) => [entry.name, entry.value]));
            for (const name of ["R2_ACCOUNT_ID", "R2_BUCKET", "R2_PUBLIC_BASE_URL"]) {
              if (!env[name]) throw new Error(`Missing service variable ${name}`);
              fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<KSHIAI_VALUE\n${env[name]}\nKSHIAI_VALUE\n`);
            }
          ' "$RUNNER_TEMP/service-r2.json"

      - name: Verify R2 credentials, listing, and public media
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$R2_SMOKE_JOB" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --image="$IMAGE_REF" \
            --service-account=kshiai-cloud-run@kshiai.iam.gserviceaccount.com \
            --set-env-vars="R2_ACCOUNT_ID=$R2_ACCOUNT_ID,R2_BUCKET=$R2_BUCKET,R2_PUBLIC_BASE_URL=$R2_PUBLIC_BASE_URL" \
            --set-secrets="R2_ACCESS_KEY_ID=kshiai-r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=kshiai-r2-secret-access-key:latest" \
            --command=node \
            --args=backend/dist/scripts/r2-smoke.js \
            --max-retries=0 \
            --task-timeout=5m \
            --quiet
          gcloud run jobs execute "$R2_SMOKE_JOB" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --wait

      - name: Record immutable staging evidence
        env:
          ACTIVATION_SOURCE: ${{ steps.e2e.outputs.activation_source }}
          EXECUTION: ${{ steps.e2e.outputs.execution }}
          EXPECTED_DIALOGUE_PROJECTION: ${{ inputs.expected_dialogue_projection }}
          RELEASE_TAG: ${{ inputs.tag }}
          REVISION: ${{ steps.backend.outputs.revision }}
          WORKER_VERSION: ${{ steps.worker.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const evidence = {
              schemaVersion: 1,
              stageRunId: process.env.GITHUB_RUN_ID,
              stageRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
              releaseTag: process.env.RELEASE_TAG,
              commitSha: process.env.GITHUB_SHA,
              revision: process.env.REVISION,
              workerVersion: process.env.WORKER_VERSION,
              dialogueProjection: process.env.EXPECTED_DIALOGUE_PROJECTION,
              dialogueActivationSource: process.env.ACTIVATION_SOURCE,
              observationExecution: process.env.EXECUTION,
              verification: "exact_revision_health_and_battle_receipt",
            };
            fs.writeFileSync(
              process.argv[1],
              `${JSON.stringify(evidence, null, 2)}\n`,
            );
          ' "$RUNNER_TEMP/stage-release-evidence.json"

      - name: Retain immutable staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage-release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/stage-release-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Write staging evidence
        env:
          CAUSAL_NARRATION_MODE: ${{ inputs.battle_causal_narration_mode }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ inputs.tag }}
          REVISION: ${{ steps.backend.outputs.revision }}
          WORKER_VERSION: ${{ steps.worker.outputs.version }}
          PREVIEW_URL: ${{ steps.worker.outputs.preview_url }}
          DIALOGUE_PROJECTION: ${{ inputs.expected_dialogue_projection }}
          DIALOGUE_ACTIVATION_SOURCE: ${{ steps.e2e.outputs.activation_source }}
          OBSERVATION_EXECUTION: ${{ steps.e2e.outputs.execution }}
        run: |
          {
            echo "## Release staging passed"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Backend digest: \`$IMAGE_DIGEST\`"
            echo "- Cloud Run revision: \`$REVISION\`"
            echo "- Causal narration mode: \`$CAUSAL_NARRATION_MODE\`"
            echo "- Administrator email: \`$ADMIN_EMAILS\`"
            echo "- Worker version: \`$WORKER_VERSION\`"
            echo "- Preview: $PREVIEW_URL"
            echo "- Dialogue projection: \`$DIALOGUE_PROJECTION\`"
            echo "- Dialogue activation source: \`$DIALOGUE_ACTIVATION_SOURCE\`"
            echo "- Staged battle execution: \`$OBSERVATION_EXECUTION\`"
            echo "- Stage run ID: \`$GITHUB_RUN_ID\`"
            echo
            echo "Dispatch **Promote release** from \`$RELEASE_TAG\` with the revision, Worker version, and Stage run ID above."
          } >> "$GITHUB_STEP_SUMMARY"
